# Generated by the HeroDevs Automated Remediation Platform.
# Scheduled scan: weekly on monday at 09:00 (UTC-6).
name: HeroDevs ARP scheduled scan

on:
  schedule:
    - cron: '0 15 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  ARP_BASE_BRANCH: develop
  ARP_WORK_BRANCH: herodevs/arp-remediation-${{ github.run_id }}-${{ github.run_attempt }}
  ARP_SCAN_FILE: .herodevs/scans/eol-scan-${{ github.run_id }}-${{ github.run_attempt }}.json
  ARP_STRATEGY: co_pilot

jobs:
  scan-and-remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Prepare HeroDevs folder structure
        run: mkdir -p .herodevs/scans

      - name: Run HeroDevs EOL scan
        # Authenticated scan — HD_CI_CREDENTIAL is the one-time CI token
        # provisioned via `hd auth provision-ci-token` and stored as a
        # repository secret (the portal's Configure step can set it).
        env:
          HD_CI_CREDENTIAL: ${{ secrets.HD_CI_CREDENTIAL }}
        run: NPM_CONFIG_ALLOW_GIT=all npx @herodevs/cli@latest scan eol --json > "${{ env.ARP_SCAN_FILE }}"

      - name: Commit scan results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(arp): record EOL scan ${{ github.run_id }}-${{ github.run_attempt }}'
          branch: ${{ env.ARP_WORK_BRANCH }}
          create_branch: true
          file_pattern: '.herodevs/scans/*.json'

      - name: Propose HeroDevs NES replacements (minor/patch only)
        run: |
          node <<'ARP_REMEDIATION'
          const fs = require('fs')

          const sameMajor = (from, to) => {
            const major = v => Number(String(v).replace(/^[^0-9]*/, '').split('.')[0])
            return Number.isFinite(major(from)) && major(from) === major(to)
          }

          let scan
          try {
            scan = JSON.parse(fs.readFileSync(process.env.ARP_SCAN_FILE, 'utf8'))
          } catch {
            console.log('No readable scan output - nothing to remediate.')
            process.exit(0)
          }

          const components = scan.components ?? scan.result?.components ?? []
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.overrides = pkg.overrides ?? {}
          let applied = 0

          for (const component of components) {
            const nes = component.nesRemediation?.remediation ?? component.nes ?? null
            const name = component.name ?? component.purl?.match(/pkg:npm\/(.+?)@/)?.[1]
            const version = component.version ?? component.purl?.match(/@([^@]+)$/)?.[1]
            const nesName = nes?.name ?? nes?.purl?.match(/pkg:npm\/(.+?)@/)?.[1]
            const nesVersion = nes?.version ?? nes?.purl?.match(/@([^@]+)$/)?.[1]
            if (!name || !version || !nesName || !nesVersion) continue
            if (!sameMajor(version, nesVersion)) continue

            pkg.overrides[name] = 'npm:' + nesName + '@' + nesVersion
            applied++
            console.log('Proposing ' + name + '@' + version + ' -> ' + nesName + '@' + nesVersion)
          }

          if (!applied) {
            console.log('No minor/patch-safe NES replacements found.')
            process.exit(0)
          }

          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          ARP_REMEDIATION

      - name: Commit proposed replacements
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix(arp): swap EOL packages for HeroDevs NES alternatives'
          branch: ${{ env.ARP_WORK_BRANCH }}
          file_pattern: 'package.json package-lock.json'

      - name: Open remediation pull request
        # Requires "Allow GitHub Actions to create and approve pull
        # requests" in the repository's Actions settings.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base "${{ env.ARP_BASE_BRANCH }}" \
            --head "${{ env.ARP_WORK_BRANCH }}" \
            --title "HeroDevs ARP remediation (run ${{ github.run_id }})" \
            --body "Automated EOL scan and NES remediation from the HeroDevs Automated Remediation Platform. Scan results are stored in ${{ env.ARP_SCAN_FILE }}." \
            --reviewer "eduardoRoth"
