# Generated by the HeroDevs Automated Remediation Platform.
# Scheduled scan: weekly on monday at 09:00 (UTC-6).
name: HeroDevs ARP scheduled scan

on:
  schedule:
    - cron: '0 15 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  ARP_BASE_BRANCH: develop
  ARP_WORK_BRANCH: herodevs/arp-remediation-${{ github.run_id }}-${{ github.run_attempt }}
  ARP_SCAN_BRANCH: herodevs/arp-scan-${{ github.run_id }}-${{ github.run_attempt }}
  ARP_SCAN_FILE: .herodevs/scans/eol-scan-${{ github.run_id }}-${{ github.run_attempt }}.json
  ARP_SCAN_ARTIFACT: arp-scan-${{ github.run_id }}-${{ github.run_attempt }}
  ARP_STRATEGY: co_pilot

jobs:
  repo-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Create remediation branch
        run: git push origin "HEAD:refs/heads/${{ env.ARP_WORK_BRANCH }}"

  scan-packages:
    needs: repo-setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --strict-peer-deps=false; else npm install --legacy-peer-deps; fi

      - name: Prepare HeroDevs folder structure
        run: mkdir -p .herodevs/scans

      - name: Run HeroDevs EOL scan
        # Authenticated scan — HD_CI_CREDENTIAL is the one-time CI token
        # provisioned via `hd auth provision-ci-token` and stored as a
        # repository secret (the portal's Configure step can set it).
        env:
          HD_CI_CREDENTIAL: ${{ secrets.HD_CI_CREDENTIAL }}
        run: npx @herodevs/cli@latest scan eol --json > "${{ env.ARP_SCAN_FILE }}"

      - name: Upload scan for the remediate job
        # The remediation branch stays free of scan telemetry, so pass the
        # scan file to the next job as an artifact instead of committing it.
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARP_SCAN_ARTIFACT }}
          path: .herodevs/scans
          if-no-files-found: error

      - name: Open auto-merged scan results pull request
        # Scan output is telemetry, not a code change — record it on its own
        # branch (cut from the base so the PR carries only the scan file) and
        # let it merge automatically. Requires "Allow auto-merge" and "Allow
        # GitHub Actions to create and approve pull requests".
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "herodevs-arp[bot]"
          git config user.email "arp@herodevs.com"
          git checkout -B "${{ env.ARP_SCAN_BRANCH }}" "origin/${{ env.ARP_BASE_BRANCH }}"
          git add "${{ env.ARP_SCAN_FILE }}"
          git commit -m "chore(arp): record EOL scan ${{ github.run_id }}-${{ github.run_attempt }}"
          git push --force origin "${{ env.ARP_SCAN_BRANCH }}"
          gh pr create \
            --base "${{ env.ARP_BASE_BRANCH }}" \
            --head "${{ env.ARP_SCAN_BRANCH }}" \
            --title "HeroDevs ARP scan results (run ${{ github.run_id }})" \
            --body "Automated EOL scan results recorded by the HeroDevs Automated Remediation Platform. This PR merges automatically."
          gh pr merge "${{ env.ARP_SCAN_BRANCH }}" --auto --squash || gh pr merge "${{ env.ARP_SCAN_BRANCH }}" --squash || true

  remediate:
    needs: scan-packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        # fetch-depth 0 so the patch-bump step can branch off origin/base.
        uses: actions/checkout@v6
        with:
          ref: ${{ env.ARP_WORK_BRANCH }}
          fetch-depth: 0

      - name: Download scan results
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARP_SCAN_ARTIFACT }}
          path: .herodevs/scans

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Classify scan and apply NES replacements
        run: |
          node <<'ARP_CLASSIFY'
          const fs = require('fs')

          const scanFile = process.env.ARP_SCAN_FILE
          let scan
          try {
            scan = JSON.parse(fs.readFileSync(scanFile, 'utf8'))
          } catch {
            console.log('No readable scan output - nothing to remediate.')
            scan = { components: [] }
          }

          const ARP_DIR = '.herodevs/arp'
          fs.mkdirSync(ARP_DIR, { recursive: true })

          // pkg:npm/%40scope/name@1.2.3 -> { name: "@scope/name", version: "1.2.3" }
          function fromPurl(purl) {
            if (!purl) return null
            const decoded = decodeURIComponent(String(purl)).replace(/^pkg:[a-z]+\//, '')
            const at = decoded.lastIndexOf('@')
            if (at <= 0) return null
            return { name: decoded.slice(0, at), version: decoded.slice(at + 1) }
          }

          function semver(version) {
            const match = String(version).match(/^(\d+)\.(\d+)\.(\d+)/)
            return match ? [Number(match[1]), Number(match[2]), Number(match[3])] : null
          }

          function severityLabel(score) {
            if (score === null) return 'Not scored'
            if (score >= 9) return 'Critical (' + score + ')'
            if (score >= 7) return 'High (' + score + ')'
            if (score >= 4) return 'Medium (' + score + ')'
            return 'Low (' + score + ')'
          }

          const components = scan.components || []
          const secured = []
          const patchBumps = []
          const inProgress = []
          const handledNames = new Set()
          let monitoringCount = 0
          let composerCount = 0

          for (const component of components) {
            const direct = component.dependencySummary && component.dependencySummary.directDependency === true
            for (const remediation of component.remediations || []) {
              if (remediation.type !== 'nes_available' || !remediation.target || !remediation.target.nesPurl) continue
              const oss = fromPurl(remediation.target.ossPurl || component.purl)
              const nes = fromPurl(remediation.target.nesPurl)
              if (!oss || !nes) continue
              const ossMajor = semver(oss.version), nesMajor = semver(nes.version)
              if (!ossMajor || !nesMajor || ossMajor[0] !== nesMajor[0]) continue
              handledNames.add(oss.name)
              secured.push({
                name: oss.name,
                from: oss.version,
                nesName: nes.name,
                nesVersion: nes.version,
                alias: 'npm:' + nes.name + '@' + nes.version,
                direct: !!direct
              })
            }
          }

          for (const component of components) {
            const meta = component.metadata || {}
            if (meta.ecosystem !== 'npm') continue
            const oss = fromPurl(component.purl)
            if (!oss || handledNames.has(oss.name)) continue
            const cur = semver(oss.version)
            if (!cur) continue
            for (const remediation of component.remediations || []) {
              if (remediation.type !== 'version_update' || !remediation.target) continue
              const tgt = semver(remediation.target.version)
              if (!tgt) continue
              if (tgt[0] === cur[0] && tgt[1] === cur[1] && tgt[2] > cur[2]) {
                handledNames.add(oss.name)
                patchBumps.push({ name: oss.name, from: oss.version, to: remediation.target.version })
                break
              }
            }
          }

          for (const component of components) {
            const meta = component.metadata || {}
            if (meta.ecosystem === 'composer') { composerCount++; continue }
            if (meta.ecosystem !== 'npm') continue
            const oss = fromPurl(component.purl)
            if (!oss || handledNames.has(oss.name)) continue
            const cves = meta.cveStats || []
            if (cves.length > 0) {
              const scores = cves.map(c => parseFloat(c.cvssScore)).filter(n => !Number.isNaN(n))
              const highest = scores.length ? Math.max.apply(null, scores) : null
              handledNames.add(oss.name)
              inProgress.push({ name: oss.name, version: oss.version, cveCount: cves.length, highestSeverity: severityLabel(highest) })
            } else if (meta.isEol === true) {
              monitoringCount++
            }
          }

          const summary = {
            totalScanned: (scan.metadata && scan.metadata.totalComponentsCount) || components.length,
            securedCount: secured.length,
            inProgressCount: inProgress.length,
            patchCount: patchBumps.length,
            monitoringCount,
            composerCount
          }

          fs.writeFileSync(ARP_DIR + '/secured.json', JSON.stringify(secured, null, 2))
          fs.writeFileSync(ARP_DIR + '/in-progress.json', JSON.stringify(inProgress, null, 2))
          fs.writeFileSync(ARP_DIR + '/patch-bumps.json', JSON.stringify(patchBumps, null, 2))
          fs.writeFileSync(ARP_DIR + '/summary.json', JSON.stringify(summary, null, 2))

          if (secured.length) {
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
            for (const item of secured) {
              if (pkg.dependencies && pkg.dependencies[item.name]) {
                pkg.dependencies[item.name] = item.alias
              } else if (pkg.devDependencies && pkg.devDependencies[item.name]) {
                pkg.devDependencies[item.name] = item.alias
              } else {
                pkg.overrides = pkg.overrides || {}
                pkg.overrides[item.name] = item.alias
              }
              console.log('Securing ' + item.name + '@' + item.from + ' -> ' + item.alias)
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 4) + '\n')
          }

          console.log('Classified: ' + secured.length + ' secured, ' + inProgress.length + ' in progress, ' + patchBumps.length + ' patch bumps.')
          ARP_CLASSIFY

      # Temporary skip updating the lockfile
      #- name: Update lockfile for proposed replacements
      #  run: |
      #    if ! git diff --quiet package.json; then
      #      npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      #    fi

      - name: Commit proposed replacements
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix(arp): swap EOL packages for HeroDevs NES alternatives'
          branch: ${{ env.ARP_WORK_BRANCH }}
          file_pattern: 'package.json package-lock.json'

      - name: Open patch-bump pull requests
        # One PR per section-3 dependency, each branched from the base.
        # Requires "Allow GitHub Actions to create and approve pull requests".
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'ARP_PATCH_PRS'
          const fs = require('fs')
          const { execSync } = require('child_process')

          const ARP_DIR = '.herodevs/arp'
          let bumps = []
          try { bumps = JSON.parse(fs.readFileSync(ARP_DIR + '/patch-bumps.json', 'utf8')) } catch {}

          const prs = {}
          if (!bumps.length) {
            fs.writeFileSync(ARP_DIR + '/patch-prs.json', JSON.stringify(prs))
            process.exit(0)
          }

          const base = process.env.ARP_BASE_BRANCH
          const runId = process.env.GITHUB_RUN_ID || 'local'
          const workBranch = process.env.ARP_WORK_BRANCH
          const run = (cmd) => execSync(cmd, { stdio: 'inherit' })
          const capture = (cmd) => execSync(cmd, { encoding: 'utf8' }).trim()

          run('git config user.name "herodevs-arp[bot]"')
          run('git config user.email "arp@herodevs.com"')

          // The scan file was downloaded here as an untracked artifact, but the
          // scan-results PR may have already merged it into the base — an untracked
          // path that also exists on the target blocks 'git checkout'. It has served
          // its purpose (classification is done), so drop it before switching.
          try { run('rm -rf .herodevs/scans') } catch {}

          for (const bump of bumps) {
            const slug = bump.name.replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-+|-+$/g, '')
            const branch = 'herodevs/arp-patch-' + slug + '-' + runId
            try {
              run('git checkout -B ' + branch + ' origin/' + base)
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
              // Direct/dev dependency: bump it in place. Otherwise it's transitive —
              // pin it through npm overrides so package.json always gains a diff
              // (a plain field edit finds nothing for nested deps and the commit
              // would be empty).
              let field = null
              if (pkg.dependencies && pkg.dependencies[bump.name]) field = 'dependencies'
              else if (pkg.devDependencies && pkg.devDependencies[bump.name]) field = 'devDependencies'
              if (field) {
                pkg[field][bump.name] = bump.to
              } else {
                pkg.overrides = pkg.overrides || {}
                pkg.overrides[bump.name] = bump.to
              }
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 4) + '\n')
              try { run('npm install --package-lock-only --ignore-scripts --no-audit --no-fund') } catch {}
              run('git add package.json package-lock.json 2>/dev/null || git add package.json')
              run('git commit -m "fix(deps): bump ' + bump.name + ' to ' + bump.to + '"')
              run('git push --force origin ' + branch)
              const url = capture('gh pr create --base "' + base + '" --head "' + branch + '" --title "[HeroDevs] Bump ' + bump.name + ' to ' + bump.to + '" --body "Patch-level version bump proposed by the HeroDevs Automated Remediation Platform: ' + bump.name + ' ' + bump.from + ' -> ' + bump.to + '."')
              prs[bump.name] = url
              console.log('Opened patch PR for ' + bump.name + ': ' + url)
            } catch (error) {
              console.log('Could not open patch PR for ' + bump.name + ': ' + (error && error.message ? error.message : error))
            }
          }

          run('git checkout ' + workBranch)
          fs.writeFileSync(ARP_DIR + '/patch-prs.json', JSON.stringify(prs, null, 2))
          ARP_PATCH_PRS

      - name: Build remediation pull request body
        run: |
          node <<'ARP_BODY'
          const fs = require('fs')

          const ARP_DIR = '.herodevs/arp'
          const T = String.fromCharCode(96)

          function read(name, fallback) {
            try { return JSON.parse(fs.readFileSync(ARP_DIR + '/' + name, 'utf8')) } catch { return fallback }
          }
          function code(text) { return T + text + T }

          const secured = read('secured.json', [])
          const inProgress = read('in-progress.json', [])
          const patchBumps = read('patch-bumps.json', [])
          const summary = read('summary.json', {})
          const patchPrs = read('patch-prs.json', {})

          const lines = []
          const total = (summary.totalScanned || 0).toLocaleString('en-US')

          const intro = []
          intro.push('Your HeroDevs GitHub integration scanned all ' + total + ' dependencies in this repo for end-of-life and vulnerable packages. Here' + String.fromCharCode(39) + 's what it found:')
          if (secured.length) intro.push(' ' + secured.length + ' dependencies are swapped to secured versions below.')
          if (inProgress.length) intro.push(' ' + inProgress.length + ' more are being actively patched by our engineers right now.')
          if (patchBumps.length) intro.push(' ' + patchBumps.length + ' already have a version-bump PR open for your review below.')
          lines.push(intro.join(''))
          lines.push('')
          lines.push('---')

          if (secured.length) {
            lines.push('')
            lines.push('<details>')
            lines.push('<summary><strong>&#9989; ' + secured.length + ' dependencies secured</strong> — replaced with patched versions</summary>')
            lines.push('')
            lines.push('These were already on the HeroDevs fork point, so we swapped them straight to secured versions. Your code still imports them under the same names — we just pointed ' + code('package.json') + ' at each HeroDevs-secured ' + code('@neverendingsupport') + ' version below, so nothing in your code changes.')
            lines.push('')
            lines.push('| Package | Previous version | HeroDevs secured version |')
            lines.push('|---|---|---|')
            for (const item of secured) lines.push('| ' + code(item.name) + ' | ' + item.from + ' | ' + item.nesVersion + ' |')
            lines.push('')
            lines.push('---')
            lines.push('')
            lines.push('</details>')
          }

          if (inProgress.length) {
            lines.push('')
            lines.push('<details>')
            lines.push('<summary><strong>&#128336; ' + inProgress.length + ' dependencies in progress</strong> — HeroDevs engineers are actively patching</summary>')
            lines.push('')
            lines.push('These ' + inProgress.length + ' carry a known vulnerability with no drop-in yet. HeroDevs engineers are building, testing, and verifying a secured version for each one. Once a fix is ready we verify it against your installed version and ship it automatically.')
            lines.push('')
            lines.push('| Package | Version | CVEs | Highest severity |')
            lines.push('|---|---|---|---|')
            for (const item of inProgress) lines.push('| ' + code(item.name) + ' | ' + item.version + ' | ' + item.cveCount + ' | ' + item.highestSeverity + ' |')
            lines.push('')
            lines.push('---')
            lines.push('')
            lines.push('</details>')
          }

          if (patchBumps.length) {
            lines.push('')
            lines.push('<details>')
            lines.push('<summary><strong>&#128295; ' + patchBumps.length + ' dependencies need your review</strong> — HeroDevs already opened the version bumps</summary>')
            lines.push('')
            lines.push('These ' + patchBumps.length + ' dependencies have a newer patch release available (same major and minor, so no breaking changes). We opened a separate pull request for each one below. Review, test, and merge each PR.')
            lines.push('')
            lines.push('| Package | Your version | Patch version | Pull request |')
            lines.push('|---|---|---|---|')
            for (const item of patchBumps) {
              const url = patchPrs[item.name]
              const pr = url ? '[#' + url.split('/').pop() + '](' + url + ')' : 'pending'
              lines.push('| ' + code(item.name) + ' | ' + item.from + ' | ' + item.to + ' | ' + pr + ' |')
            }
            lines.push('')
            lines.push('---')
            lines.push('')
            lines.push('</details>')
          }

          if (summary.monitoringCount) {
            lines.push('')
            lines.push('*Additionally, HeroDevs is continuously monitoring ' + summary.monitoringCount + ' other end-of-life dependencies in this repository that have no known vulnerability today. The moment one is exploited, our engineers will build, test, and push a secured version automatically.*')
          }
          if (summary.composerCount) {
            lines.push('')
            lines.push('*Separately: PHP/composer packages aren' + String.fromCharCode(39) + 't in the HeroDevs NES catalog yet, so only npm dependencies can be automatically secured.*')
          }

          lines.push('')
          lines.push('---')
          lines.push('')
          lines.push('### What changed')
          lines.push('- [x] ' + code('package.json') + ': ' + secured.length + ' packages aliased to their ' + code('@neverendingsupport') + ' secured versions')
          lines.push('- [ ] ' + code('package-lock.json') + ': regenerated against HeroDevs-resolved versions')
          lines.push('')
          lines.push('*Opened automatically by HeroDevs*')

          fs.writeFileSync(ARP_DIR + '/pr-body.md', lines.join('\n') + '\n')
          console.log('Wrote ' + ARP_DIR + '/pr-body.md')
          ARP_BODY

      - name: Open remediation pull request
        # Requires "Allow GitHub Actions to create and approve pull
        # requests" in the repository's Actions settings. Skipped when there
        # is nothing to remediate — the branch has no diff against the base
        # (scan telemetry rides its own auto-merged PR).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(git rev-list --count origin/${{ env.ARP_BASE_BRANCH }}..HEAD)" -eq 0 ]; then
            echo "No NES replacements to propose; skipping remediation PR."
            exit 0
          fi
          gh pr create \
            --base "${{ env.ARP_BASE_BRANCH }}" \
            --head "${{ env.ARP_WORK_BRANCH }}" \
            --title "HeroDevs ARP remediation (run ${{ github.run_id }})" \
            --body-file .herodevs/arp/pr-body.md \
            --reviewer "eduardoRoth"

  clean-up:
    needs: remediate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Delete abandoned remediation branch
        # The branch only stays when a PR is reviewing it; failed or empty
        # runs must not litter the repository with dead branches.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open_prs=$(gh pr list --head "${{ env.ARP_WORK_BRANCH }}" --state open --json number --jq 'length' || echo 0)
          if [ "$open_prs" = "0" ]; then
            git push origin --delete "${{ env.ARP_WORK_BRANCH }}" || true
            echo "Deleted ${{ env.ARP_WORK_BRANCH }} (no open pull request)."
          else
            echo "Keeping ${{ env.ARP_WORK_BRANCH }} — pull request is open."
          fi